[project]
name = "football-odds-predictor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Eric", email = "eric.gabriel705@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
football-odds-predictor = "football_odds_predictor:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
